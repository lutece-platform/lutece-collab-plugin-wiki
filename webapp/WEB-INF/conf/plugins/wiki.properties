# {plugin.pluginName} properties file

#######################################################################################################
# Default Labels for XPage
wiki.pageTitle=wiki
wiki.pagePathLabel=wiki

# Fuzzy search configuration
wiki.search.fuzzy.minResultsBeforeFuzzy=5
wiki.search.fuzzy.editDistance=2
wiki.search.fuzzy.enabled=true

# File store service provider configuration
wiki.fileStoreServiceProvider.fileStoreService=localDatabaseFileService
wiki.fileStoreServiceProvider.rbacService=wiki.wikiFileRBACService
wiki.fileStoreServiceProvider.downloadService=defaultFileDownloadService