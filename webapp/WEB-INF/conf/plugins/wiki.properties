# {plugin.pluginName} properties file

#######################################################################################################
# Default Labels for XPage
wiki.pageTitle=wiki
wiki.pagePathLabel=wiki

# Fuzzy search configuration
wiki.search.fuzzy.minResultsBeforeFuzzy=5
wiki.search.fuzzy.editDistance=2
wiki.search.fuzzy.enabled=true
# User attribute value suggestions : walking the user directory takes seconds, so it runs here
daemon.wikiUserAttributeValuesDaemon.interval=86400
daemon.wikiUserAttributeValuesDaemon.onstartup=1
